<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="10">

    <title>Cotação do Dólar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>Cotação do Dólar</h1>
        <p class="subtitulo">USD/BRL</p>

        <div class="cotacoes">

            <div class="card">
                <h2>Valor Atual</h2>
                <p id="valorAtual">Carregando...</p>
            </div>

            <div class="card">
                <h2>Maior Valor do Dia</h2>
                <p id="maiorValor">Carregando...</p>
            </div>

            <div class="card">
                <h2>Menor Valor do Dia</h2>
                <p id="menorValor">Carregando...</p>
            </div>

        </div>
    </main>

    <script src="script.js"></script>

</body>

</html>
